name: Deployment Smoke
on:
  deployment_status:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Vercel's unique deployment URLs are protected by Deployment Protection
      # and redirect anonymous requests to Vercel SSO. Smoke the public production
      # alias instead so the check validates the deployed production application.
      SMOKE_BASE_URL: https://evironn-app.vercel.app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:production
