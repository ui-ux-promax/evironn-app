name: Deployment Smoke
on:
  deployment_status:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # This job intentionally has no job-level condition: GitHub treats a
      # skipped required job as successful and may allow a merge.
      # Vercel's unique deployment URLs are protected by Deployment Protection
      # and redirect anonymous requests to Vercel SSO. Smoke the public production
      # alias instead so the check validates the deployed production application.
      SMOKE_BASE_URL: https://evironn-app.vercel.app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require completed deployment
        env:
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
        run: |
          if [ "$DEPLOYMENT_STATE" != "success" ]; then
            echo "Deployment status is '$DEPLOYMENT_STATE'; smoke is not allowed to pass."
            exit 1
          fi
      - run: npm run smoke:production
